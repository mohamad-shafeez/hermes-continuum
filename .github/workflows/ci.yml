name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "cryptography>=46,<51" fastapi httpx pytest pyyaml
      - name: Byte-compile
        run: python -m compileall -q continuum_core __init__.py tests dashboard
      - name: Run tests
        run: python -m pytest tests -q
